name: CI

on:
  push:
  pull_request:

jobs:
  guard-tests:
    # Offline tests: live-question guard (quota, money cap, access sessions) and the corpus
    # contract. scripts/release_check.py runs everything, including the model-backed tests.
    # The API end-to-end test needs the frozen paper assets, which are not in this repo.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy==2.5.4
      - run: python -m unittest tests.test_live_guard -v
      # Corpus contract, parser rules (tests needing the local PDF cache skip themselves),
      # numeric gold helpers. Pure stdlib.
      - run: python -m unittest tests.test_corpus_contract tests.test_corpus_v3 tests.test_numeric_gold -v

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: node --test tests/answerRevision.test.js
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Public data is complete
        run: |
          for f in corpora.json questions.json showcase.json recordings/index.json pdf/BYD.pdf pdf/WSI.pdf; do
            test -s "web/dist/data/$f" || { echo "missing $f"; exit 1; }
          done
